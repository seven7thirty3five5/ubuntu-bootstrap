name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck bootstrap.sh
      - name: Validate config.toml against the schema of the pinned mise release
        run: |
          version=$(sed -n 's/^ *MISE_VERSION=\(v[0-9.]*\).*/\1/p' bootstrap.sh)
          test -n "$version"
          pipx run check-jsonschema==0.39.0 \
            --schemafile "https://raw.githubusercontent.com/jdx/mise/$version/schema/mise.json" \
            config.toml
